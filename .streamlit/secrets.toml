# Rename this to secrets.toml and fill values for production
# These are example values; override via environment or Streamlit Cloud secrets
[auth]
admin_username = "admin"
# Use a strong password in production; consider generating via `openssl rand -base64 32`
admin_password = "change-me"
# Optional: set to true to allow user signup
allow_signup = false

[app]
app_name = "Streamlit Blog"
session_cookie_key = "please-change-session-cookie-key"

[storage]
# Folder paths
uploads_dir = "/workspace/data/uploads"
database_path = "/workspace/data/blog.db"